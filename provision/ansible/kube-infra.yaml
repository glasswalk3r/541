---
- hosts: all
  become: yes
  become_user: root
  become_method: sudo
  roles:
    - snap_removal
  tasks:
    - name: Garantindo /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
      with_items:
        - 172.16.1.100 kube-master
        - 172.16.1.101 kube-node1
        - 172.16.1.102 kube-node2
        - 172.16.1.103 kube-infra
        - 172.16.1.202 docker-registry

    - name: Adiciona usuário suporte
      ansible.builtin.user:
        name: suporte
        shell: /bin/bash
        password : $1$QbUARykG$p2nthVG8AkDvabKPHwboa1

    - name: Adiciona usuário analista
      ansible.builtin.user:
        name: analista
        shell: /bin/bash
        password : $1$QbUARykG$p2nthVG8AkDvabKPHwboa1

    - name: Instala pacotes que permitem que o apt seja usado sobre HTTPS
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg-agent
        - software-properties-common
        - git
        - vim

    - name: Clona repositório com os arquivos do curso para a HOME do usuário suporte
      ansible.builtin.git:
        repo: 'https://github.com/4linux/541-kubernetes.git'
        dest: /home/suporte/541

    - name: Garantir permissão de superusuário para o usuário analista
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        insertafter: "suporte ALL=(ALL) NOPASSWD: ALL"
        line: "analista ALL=(ALL) NOPASSWD: ALL"

    - name: Clona repositório com os arquivos do curso para a HOME do usuário analista
      ansible.builtin.git:
        repo: 'https://github.com/4linux/541-kubernetes.git'
        dest: /home/analista/541

    - name: Cria o diretório .ssh
      ansible.builtin.file:
        path: /home/analista/.ssh
        state: directory
        owner: analista
        group: analista
        mode: '0755'

    - name: Criando o arquivo authorized_keys
      ansible.builtin.copy:
        src: files/authorized_keys
        dest: /home/analista/.ssh/authorized_keys
        owner: analista
        group: analista
        mode: 0644

    - name: Criando diretório /nfs
      ansible.builtin.file:
        path: /nfs
        state: directory
        owner: nobody
        group: nogroup
        mode: '0775'

    - name: Criando diretório /backups
      ansible.builtin.file:
        path: /backups
        state: directory
        owner: nobody
        group: nogroup
        mode: '0775'

    - name: Instalando o NFS e DNS Server
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - nfs-kernel-server
        - bind9

    - name: Criando o arquivo exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ item }}"
      with_items:
        - /nfs 172.16.1.0/24(rw,no_root_squash,no_subtree_check)
        - /backups 172.16.1.0/24(rw,no_root_squash,no_subtree_check)

    - name: Reinicia o service do nfs-kernel-server
      ansible.builtin.systemd:
        state: restarted
        name: nfs-kernel-server

    - name: Criando o arquivo named.conf.local
      ansible.builtin.copy:
        src: files/named.conf.local
        dest: /etc/bind
        owner: root
        group: bind
        mode: 0644

    - name: Criando o arquivo named.conf.options
      ansible.builtin.copy:
        src: files/named.conf.options
        dest: /etc/bind
        owner: root
        group: bind
        mode: 0644

    - name: Criando o arquivo 4labs.example
      ansible.builtin.copy:
        src: files/4labs.example
        dest: /etc/bind
        owner: root
        group: bind
        mode: 0644

    - name: Criando o arquivo 1.16.172.db
      ansible.builtin.copy:
        src: files/1.16.172.db
        dest: /etc/bind
        owner: root
        group: bind
        mode: 0644

    - name: Reinicia o service do bind9
      ansible.builtin.systemd:
        state: restarted
        name: bind9

    - name: Adiciona uma chave de assinatura apt para o Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adiciona repositório apt para versão estável
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu xenial stable
        state: present

    - name: Instala o Docker e suas dependencias
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io

    - name: Criando o arquivo daemon.json
      ansible.builtin.copy:
        src: files/daemon.json
        dest: /etc/docker/
        owner: root
        group: root
        mode: '0644'

    - name: Cria o diretorio docker.service.d
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Reinicia o Docker
      ansible.builtin.service:
        name: docker
        daemon_reload: yes
        state: restarted

    - name: Adiciona o usuário suporte no grupo docker
      ansible.builtin.user:
        name: suporte
        group: docker

    - name: Adiciona o usuário analista no grupo docker
      ansible.builtin.user:
        name: analista
        group: docker

