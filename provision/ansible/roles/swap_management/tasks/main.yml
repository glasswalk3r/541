---
# tasks file for swap_management

- name: Remove o swap do arquivo /etc/fstab
  ansible.posix.mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  with_items:
    - swap
    - none

- name: Desabilita o swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: ansible_swaptotal_mb > 0

- name: Remove o arquivo de swap /swap.img
  ansible.builtin.file:
    path: /swap.img
    state: absent
